<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Pocket Mido+</title>
    <meta content="Fusion tools for Megami Tensei games." name="description">
    <script type="text/javascript">
      // GitHub Pages has no server-side routing, so it answers every deep link
      // with this page. Hand the path back to the app as a query parameter and
      // let its router put it back. $SITE_ROOT is filled in at build time.
      const l = window.location
      const csrParam = 'csr'
      const siteRoot = '$SITE_ROOT'
      const pathParams = encodeURIComponent(l.pathname.slice(siteRoot.length))
      const replacePath = (
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + siteRoot + '/' +
        '?' + (l.search + '&' + csrParam + '=' + pathParams).slice(1) +
        l.hash
      )
      l.replace(replacePath)
    </script>
  </head>
  <body>
    Please navigate manually to <code>$SITE_ROOT/</code>
  </body>
</html>
